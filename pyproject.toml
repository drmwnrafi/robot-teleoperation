[project]
name = "robot-teleoperation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "babyros",
    "fmpose3d>=0.0.9",
    "mediapipe==0.10.21",
    "numpy<2",
    "onnx>=1.22.0",
    "onnxruntime-gpu==1.26.0",
    "opencv-python<4.13", 
    "pose-estimation-recognition-utils-rtmlib>=0.3.1",
    "pyvista>=0.48.4",
    "setuptools==79.0.1",
    "onnxruntime-gpu>=1.27.0",
    "pyvistaqt>=0.12.0",
    "rich>=15.0.0",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "ultralytics>=8.4.137",
]

[tool.uv.workspace]
members = [
    "lib/babyros",
]

[tool.uv.sources]
babyros = { workspace = true, editable = true }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
