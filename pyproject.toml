[project]
name = "robot-teleoperation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "babyros",
    "mediapipe==0.10.21",
    "onnx>=1.22.0",
    "opencv-python<4.13",
    "pyvista>=0.48.4",
    "setuptools==79.0.1",
    "onnxruntime-gpu>=1.27.0",
    "rich>=15.0.0",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "ultralytics>=8.4.137",
    "pandas>=3.0.5",
    "caliscope>=0.11.6",
]

[tool.uv.workspace]
members = [
    "lib/babyros",
]

[tool.uv.sources]
babyros = { workspace = true, editable = true }
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true


